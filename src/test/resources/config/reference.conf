carcomfort {
  execution {
    id = "${EXECUTION_ID}"
    id = "exec-${BUILD_NUMBER:-local}-${BUILD_TIMESTAMP:-unknown}"
    parallel = false
    threadCount = 1
    timeoutMinutes = 60
  }

  appium {
    server {
      host = "127.0.0.1"
      port = 4723
      # Base path prefix for webdriver routes. Empty = server root (Appium 2/3 default).
      # Only set if the server is started with --base-path.
      path = ""
      autoStart = true
      startupTimeoutSeconds = 30
    }
    capabilities {
      automationName = "UiAutomator2"
      platformName = "Android"
      deviceName = "${ANDROID_DEVICE_NAME}"
      udid = "${ANDROID_DEVICE_UDID}"
      platformVersion = "${ANDROID_DEVICE_OS_VERSION}"
      appPackage = "${ANDROID_APP_PACKAGE}"
      appActivity = "${ANDROID_APP_ACTIVITY}"
      noReset = true
      fullReset = false
      autoGrantPermissions = true
      newCommandTimeout = 300
      unicodeKeyboard = true
      resetKeyboard = true
      ensureWebviewsHavePages = true
      nativeWebScreenshot = true
      ignoreHiddenApiPolicyError = true
      disableWindowAnimation = true
      mjpegServerPort = 9090
      mjpegServerScreenshotQuality = 50
      mjpegServerFramerate = 10
    }
    session {
      implicitWaitSeconds = 0
      explicitWaitDefaultSeconds = 15
      explicitWaitLongSeconds = 30
      pollingIntervalMs = 500
    }
  }

  android {
    device {
      connectionType = "USB"
      adbPath = "/Users/ritik/Library/Android/sdk/platform-tools/adb"
      adbServerPort = 5037
      screenUnlockRequired = true
      screenLockType = "NONE"
      requireAuthorized = true
      healthCheckIntervalSeconds = 30
    }
    app {
      package = "${ANDROID_APP_PACKAGE}"
      activity = "${ANDROID_APP_ACTIVITY}"
      installTimeoutSeconds = 120
      launchTimeoutSeconds = 30
      clearDataBetweenTests = false
      uninstallAfterSession = false
    }
    locator {
      strategyPriority = ["accessibility-id", "resource-id", "text", "uiautomator", "xpath"]
      accessibilityIdPrefix = ""
      resourceIdPrefix = ""
      useFlutterSemantics = true
      coordinateFallbackEnabled = false
    }
    gestures {
      swipeDurationMs = 800
      tapDurationMs = 100
      longPressDurationMs = 1000
      scrollDurationMs = 1000
    }
  }

  ios {
    device {
      connectionType = "USB"
      udid = "${IOS_DEVICE_UDID}"
      xcodeOrgId = "${IOS_XCODE_ORG_ID}"
      xcodeSigningId = "${IOS_XCODE_SIGNING_ID}"
      wdaLocalPort = 8100
      webDriverAgentUrl = "${IOS_WDA_URL}"
      requireTrusted = true
    }
    app {
      bundleId = "${IOS_APP_BUNDLE_ID}"
      installTimeoutSeconds = 180
      launchTimeoutSeconds = 45
    }
    capabilities {
      automationName = "XCUITest"
      platformName = "iOS"
      deviceName = "${IOS_DEVICE_NAME}"
      platformVersion = "${IOS_DEVICE_OS_VERSION}"
      noReset = true
      fullReset = false
      autoGrantPermissions = true
      newCommandTimeout = 300
    }
  }

  web {
    customer {
      baseUrl = "${CUSTOMER_PWA_URL}"
      browser = "chrome"
      headless = false
      windowWidth = 1920
      windowHeight = 1080
      implicitWaitSeconds = 0
      explicitWaitDefaultSeconds = 15
      explicitWaitLongSeconds = 30
    }
    admin {
      baseUrl = "${ADMIN_PWA_URL}"
      browser = "chrome"
      headless = false
      windowWidth = 1920
      windowHeight = 1080
      implicitWaitSeconds = 0
      explicitWaitDefaultSeconds = 15
      explicitWaitLongSeconds = 30
    }
    selenium {
      remoteUrl = "${SELENIUM_REMOTE_URL}"
      gridEnabled = false
      capabilities {
        chrome {
          args = ["--disable-gpu", "--no-sandbox", "--disable-dev-shm-usage", "--window-size=1920,1080"]
          prefs = {}
        }
        firefox {
          args = ["--width=1920", "--height=1080"]
          prefs = {}
        }
      }
    }
  }

  deviceLock {
    enabled = true
    lockDir = "${user.dir}/artifacts/device-locks"
    lockTimeoutSeconds = 300
    heartbeatIntervalSeconds = 10
    staleLockCleanupSeconds = 600
    ownerId = "${AUTOMATION_OWNER_ID:-default-agent}"
  }

  gated {
    enabled = true
    requireExplicitAuthorization = true
    allowedCases = []
    blockedCategories = ["GATED", "ONE_TIME", "VERIFICATION", "PAYMENT_SETUP", "ACCOUNT_BOOTSTRAP", "DESTRUCTIVE"]
    abortOnUnauthorized = true
  }

  testData {
    dataDir = "${user.dir}/artifacts/testdata"
    maskSecretsInLogs = true
    maskSecretsInReports = true
    secretPatterns = ["password", "otp", "token", "secret", "key", "cvv", "card", "pin", "ssn", "aadhar", "pan"]
  }

  reporting {
    extent {
      enabled = true
      reportDir = "${user.dir}/artifacts/reports/extent"
      reportName = "Car Comfort Automation Report"
      documentTitle = "Car Comfort - Automation Execution Report"
      theme = "STANDARD"
      timelineEnabled = true
      offlineReport = false
    }
    pdf {
      enabled = true
      reportDir = "${user.dir}/artifacts/reports/pdf"
      includeScreenshots = true
      maxScreenshotsPerTest = 5
      includeDeviceInfo = true
      includeAppInfo = true
      includeExecutionSummary = true
      includeFailureDetails = true
    }
    json {
      enabled = true
      reportDir = "${user.dir}/artifacts/reports/json"
    }
    evidence {
      enabled = true
      captureOnFailure = true
      captureOnSuccess = "CHECKPOINT_ONLY"
      screenshotDir = "${user.dir}/artifacts/evidence/screenshots"
      pageSourceDir = "${user.dir}/artifacts/evidence/page-source"
      videoDir = "${user.dir}/artifacts/evidence/videos"
      maxScreenshotsPerTest = 10
      compressScreenshots = true
    }
  }

  logging {
    level = "DEBUG"
    structured = true
    includeThreadName = true
    includeLoggerName = true
    maskSecrets = true
    secretPatterns = ["password", "otp", "token", "secret", "key", "cvv", "card", "pin"]
  }

  waits {
    defaultTimeoutSeconds = 15
    longTimeoutSeconds = 30
    shortTimeoutSeconds = 5
    pollingIntervalMs = 500
    ignoreExceptions = ["org.openqa.selenium.NoSuchElementException", "org.openqa.selenium.StaleElementReferenceException", "org.openqa.selenium.ElementNotInteractableException"]
  }

  assertions {
    softAssertionsEnabled = true
    screenshotOnAssertionFailure = true
    pageSourceOnAssertionFailure = true
    stopOnFirstFailure = false
  }

  recovery {
    enabled = true
    maxRetries = 2
    retryDelaySeconds = 5
    recoverableErrors = [
      "NoSuchSessionException",
      "SessionNotCreatedException",
      "UnknownHostException",
      "ConnectException",
      "SocketTimeoutException"
    ]
    nonRecoverableErrors = [
      "AssertionError",
      "WebDriverException"
    ]
  }

  exploration {
    safeMode = true
    maxScreensPerSession = 50
    maxDepth = 10
    excludedActions = ["delete", "remove", "destroy", "permanent", "irreversible", "payment", "purchase", "verify", "kyc", "stripe"]
    captureScreenshots = true
    captureHierarchy = true
    analyzeLocators = true
  }

  mcp {
    # Appium MCP is a stdio sidecar (see .agents/mcp_config.json), not an HTTP service.
    # These flags mirror the MCP server env so agents and docs stay consistent.
    docsEnabled = true
    noUi = true
    evidence = true
    visionEnabled = false
    screenshotsDir = "${user.dir}/artifacts/evidence/mcp-screenshots"
  }
}